name: 'OVERSTORY doc drift'
description: 'Comment on a pull request when it changes code under doc comments it did not update.'
branding:
  icon: 'git-commit'
  color: 'green'

inputs:
  base:
    description: 'Ref to compare against. Defaults to the pull request base.'
    required: false
    default: ''
  fail-on-drift:
    description: >
      Fail the check when drift is found. Defaults to false on purpose: a tool that starts
      breaking CI the day it is installed gets removed before anyone sees what it is for.
      Turn this on once the team trusts the signal.
    required: false
    default: 'false'
  check-contract:
    description: >
      Also run the contract check (documented parameter lists vs real signatures) on the
      files this pull request changed. These findings are provable, not suspected.
    required: false
    default: 'true'
  fail-on-broken-contract:
    description: 'Fail the check when a documented parameter provably does not exist. Off by default.'
    required: false
    default: 'false'
  include-body:
    description: 'Also flag changes below the declaration line. Noisier; off by default.'
    required: false
    default: 'false'
  comment:
    description: 'Post a pull request comment with the findings.'
    required: false
    default: 'true'

outputs:
  drift-count:
    description: 'Number of changed symbols whose docs did not move.'
    value: ${{ steps.drift.outputs.count }}
  contract-count:
    description: 'Number of documented parameters that provably do not exist, in changed files.'
    value: ${{ steps.drift.outputs.contract }}

runs:
  using: composite
  steps:
    - name: run overstory drift
      id: drift
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_INCLUDE_BODY: ${{ inputs.include-body }}
        INPUT_CHECK_CONTRACT: ${{ inputs.check-contract }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -uo pipefail
        BASE="${INPUT_BASE:-$PR_BASE_SHA}"
        if [ -z "$BASE" ]; then
          echo "No base ref available; supply the 'base' input outside a pull request." >&2
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "contract=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The checkout is usually shallow, so the base commit may be absent locally.
        git fetch --no-tags --depth=50 origin "$BASE" 2>/dev/null || true
        EXTRA=""
        [ "$INPUT_INCLUDE_BODY" = "true" ] && EXTRA="--include-body"
        npx --yes @northtek/overstory drift . --base "$BASE" $EXTRA --json > drift.json || true
        COUNT=$(node -p "try{JSON.parse(require('fs').readFileSync('drift.json','utf8')).findings.length}catch(e){0}")
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Found $COUNT changed symbol(s) whose docs did not move."
        # Contract findings are PROVABLE (a documented parameter that does not exist), and
        # scoped by --base to the files this change touched — a bot that reports pre-existing
        # findings on an unrelated pull request is a bot that gets uninstalled.
        CCOUNT=0
        if [ "$INPUT_CHECK_CONTRACT" = "true" ]; then
          npx --yes @northtek/overstory contract . --base "$BASE" --json > contract.json || true
          CCOUNT=$(node -p "try{JSON.parse(require('fs').readFileSync('contract.json','utf8')).findings.filter(f=>f.documentedButMissing.length>0).length}catch(e){0}")
        fi
        echo "contract=$CCOUNT" >> "$GITHUB_OUTPUT"
        echo "Found $CCOUNT documented parameter(s) that provably do not exist in changed files."

    - name: comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report;
          try { report = JSON.parse(fs.readFileSync('drift.json', 'utf8')); } catch { return; }
          const findings = report.findings || [];
          let broken = [];
          try {
            const c = JSON.parse(fs.readFileSync('contract.json', 'utf8'));
            broken = (c.findings || []).filter((f) => f.documentedButMissing.length > 0);
          } catch { /* contract check disabled or produced nothing */ }
          const MARKER = '<!-- overstory-drift -->';

          const sections = [];
          if (broken.length > 0) {
            sections.push(
              `**${broken.length} documented parameter${broken.length === 1 ? '' : 's'} that provably do${broken.length === 1 ? 'es' : ''} not exist** (in files this PR touches):`,
              '',
              ...broken.slice(0, 15).map((f) =>
                `- \`${f.file}:${f.line}\` — **${f.symbol}** documents \`${f.documentedButMissing.join('`, `')}\`${f.suggestion ? `\n  > ${f.suggestion}` : ''}`),
              broken.length > 15 ? `…and ${broken.length - 15} more.` : '',
              '',
            );
          }
          if (findings.length > 0) {
            sections.push(
              `**${findings.length} changed symbol${findings.length === 1 ? '' : 's'} whose doc comment${findings.length === 1 ? '' : 's'} did not move:**`,
              '',
              ...findings.slice(0, 20).map((f) =>
                `- \`${f.file}:${f.line}\` — **${f.symbol}**\n  > ${f.comment}`),
              findings.length > 20 ? `…and ${findings.length - 20} more.` : '',
              '',
              'Either the comment still holds and you can ignore this, or it does not and nobody would have noticed.',
            );
          }

          const body = sections.length === 0
            ? `${MARKER}\n**OVERSTORY** — no documentation drift in this change.`
            : [MARKER, '**OVERSTORY**', '', ...sections].join('\n');

          // Update one comment in place. Posting per push trains people to mute the bot.
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
            .data.find((c) => c.body && c.body.includes(MARKER));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else if (findings.length > 0 || broken.length > 0) {
            // Do not open with a "nothing to see here" comment on a clean pull request.
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: fail when asked to
      if: ${{ (inputs.fail-on-drift == 'true' && steps.drift.outputs.count != '0') || (inputs.fail-on-broken-contract == 'true' && steps.drift.outputs.contract != '0') }}
      shell: bash
      run: |
        echo "Documentation problems found and failing was requested." >&2
        exit 1
